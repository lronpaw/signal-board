<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Signal</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1a1f2b 0%, #0a0c11 100%);
    color: #f2f4f8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button {
    appearance: none;
    border: none;
    background: linear-gradient(180deg, #2d6cdf 0%, #1e4fb2 100%);
    color: #fff;
    width: min(70vw, 70vh, 320px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 20px 60px rgba(45, 108, 223, 0.35), inset 0 -8px 24px rgba(0,0,0,0.2);
    transition: transform .08s ease, box-shadow .2s ease;
  }
  button:active { transform: scale(0.94); box-shadow: 0 8px 20px rgba(45, 108, 223, 0.25); }
  button.playing { background: linear-gradient(180deg, #3b8a4a 0%, #276a34 100%); box-shadow: 0 20px 60px rgba(59, 138, 74, 0.35), inset 0 -8px 24px rgba(0,0,0,0.2); }
</style>
</head>
<body>
  <button id="signal" aria-label="Signal">Tap</button>

<script>
(async () => {
  const btn = document.getElementById('signal');
  let sounds = [];
  try {
    const res = await fetch('sounds/manifest.json', { cache: 'no-cache' });
    const manifest = await res.json();
    sounds = manifest.sounds.map(s => new Audio('sounds/' + s.file));
    sounds.forEach(a => { a.preload = 'auto'; });
  } catch (e) {
    btn.textContent = 'Error';
    return;
  }

  let current = null;
  let lastIndex = -1;

  btn.addEventListener('click', () => {
    if (!sounds.length) return;
    if (current) { current.pause(); current.currentTime = 0; }

    let i;
    if (sounds.length === 1) { i = 0; }
    else { do { i = Math.floor(Math.random() * sounds.length); } while (i === lastIndex); }
    lastIndex = i;

    current = sounds[i];
    current.currentTime = 0;
    btn.classList.add('playing');
    current.play().catch(() => {});
    current.onended = () => btn.classList.remove('playing');
    if (navigator.vibrate) navigator.vibrate(20);
  });
})();
</script>
</body>
</html>
